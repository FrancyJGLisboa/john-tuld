name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skill contract
        run: python3 skills/john-tuld/scripts/validate_contract.py skills/john-tuld
      - name: Validate plugin package
        run: python3 scripts/validate_package.py
      - name: Test installer
        run: python3 -m unittest discover -s tests -v
